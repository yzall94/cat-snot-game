<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>냥이 콧물 돌돌돌</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#d9d6cf;font-family:system-ui,'Malgun Gothic',sans-serif}canvas{display:block;cursor:none}
#ui{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;color:#333}
#msg{font-size:22px;font-weight:800;text-shadow:0 2px 0 #fff}#sub{font-size:14px;margin-top:4px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0006;color:#fff;font-size:34px;font-weight:900;text-align:center}
#ov button{margin-top:18px;font-size:20px;padding:10px 28px;border:0;border-radius:30px;background:#fff;cursor:pointer;font-weight:800}</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><div id="msg">휴지 끝을 콧구멍에 대고 클릭!</div><div id="sub">클릭 = 콧물 걸치기 · 마우스 휠 = 돌돌돌 · 너무 빠르거나(초당 휠 14칸↑) 15초 넘기면 냥이 빡침</div></div>
<div id="ov"><div id="ovt"></div><button onclick="reset()">다시 하기</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,S,CX,CY;
function rs(){W=C.width=innerWidth*devicePixelRatio;H=C.height=innerHeight*devicePixelRatio;S=Math.min(W,H)/620;CX=W/2;CY=H*0.52}addEventListener('resize',rs);rs();
const MAXSPD=1400,NEED=3200,LIMIT=15; // 휠 px/s (1칸≈100px), 총 필요량(≈32칸), 제한시간
let mx=0,my=0,st,prog,rot,t0,irr,spdBuf,ang,happy,blink,nextBlink,shake,tm=0,lookX=0,lookY=0,twitch=0,hint=0;
const msg=document.getElementById('msg'),ov=document.getElementById('ov'),ovt=document.getElementById('ovt');
function reset(){st='ready';prog=0;rot=0;irr=0;spdBuf=[];ang=0;happy=0;blink=0;nextBlink=2;shake=0;ov.style.display='none';msg.textContent='휴지 끝을 콧구멍에 대고 클릭!'}reset();
const NOS={x:-9,y:47};
function toL(px,py){return{x:(px-CX)/S,y:(py-CY)/S}}
addEventListener('mousemove',e=>{mx=e.clientX*devicePixelRatio;my=e.clientY*devicePixelRatio});
addEventListener('mousedown',()=>{if(st!=='ready')return;const p=toL(mx,my);if(Math.hypot(p.x-NOS.x,p.y-NOS.y)<26){st='att';t0=tm;msg.textContent='걸쳤다! 휠로 돌돌돌~'}else{hint=1;msg.textContent='콧구멍(왼쪽)에 더 가까이!'}});
addEventListener('wheel',e=>{e.preventDefault();if(st!=='att')return;let d=Math.abs(e.deltaY)*(e.deltaMode===1?33:e.deltaMode===2?400:1);d=Math.min(d,300);spdBuf.push([tm,d]);prog+=d/NEED;rot+=d*0.02},{passive:false});
function end(win,txt){st=win?'win':'lose';setTimeout(()=>{ovt.innerHTML=txt;ov.style.display='flex'},win?900:1100)}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;tm+=dt;upd(dt);draw();requestAnimationFrame(loop)}
function upd(dt){spdBuf=spdBuf.filter(a=>tm-a[0]<.5);const spd=spdBuf.reduce((s,a)=>s+a[1],0)/.5;
 if(st==='att'){const el=tm-t0;
  if(spd>MAXSPD){irr+=dt*1.6;msg.textContent='너무 빨라!! 냥이 표정 봐...'}else{irr=Math.max(0,irr-dt*.5);msg.textContent=`돌돌돌~ ${Math.min(100,prog*100|0)}%  ·  ${Math.max(0,LIMIT-el).toFixed(1)}초`}
  const p=toL(mx,my);if(Math.hypot(p.x-NOS.x,p.y-NOS.y)>190){st='ready';prog*=.4;msg.textContent='뚝! 콧물이 끊겼다. 다시 걸쳐!'}
  if(irr>=1){msg.textContent='하악!!!';shake=1;end(0,'😾 하악!!<br><span style="font-size:20px">너무 세게 돌렸다냥</span>')}
  else if(el>LIMIT){msg.textContent='하악!!!';shake=1;end(0,'😾 언제까지 할거냥!!<br><span style="font-size:20px">15초 초과</span>')}
  else if(prog>=1){msg.textContent='쑥~ 시원하다냥!';end(1,'😻 성공!<br><span style="font-size:20px">'+(tm-t0).toFixed(1)+'초 만에 콧물 제거</span>')}
  twitch+=dt*(4+spd/200)}
 const tA=st==='lose'?1:Math.min(.8,irr*.8+(st==='att'?Math.max(0,(tm-t0-10)/5)*.5:0));ang+=(tA-ang)*Math.min(1,dt*6);
 happy+=((st==='win'?1:0)-happy)*Math.min(1,dt*5);shake=Math.max(0,shake-dt*1.2);hint=Math.max(0,hint-dt*2);
 nextBlink-=dt;if(nextBlink<0){blink=1;nextBlink=2+Math.random()*3}blink=Math.max(0,blink-dt*7);
 const p=toL(mx,my);lookX+=((Math.max(-1,Math.min(1,p.x/250)))-lookX)*dt*5;lookY+=((Math.max(-1,Math.min(1,p.y/250)))-lookY)*dt*5}
function E(x,y,rx,ry,f,r=0){X.beginPath();X.ellipse(x,y,rx,ry,r,0,7);X.fillStyle=f;X.fill()}
function draw(){X.setTransform(1,0,0,1,0,0);X.fillStyle='#d9d6cf';X.fillRect(0,0,W,H);
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e9e6e0');g.addColorStop(1,'#bdb8ae');X.fillStyle=g;X.fillRect(0,0,W,H);
 if(ang>.5){X.fillStyle=`rgba(200,0,0,${(ang-.5)*.25})`;X.fillRect(0,0,W,H)}
 const br=Math.sin(tm*2.2)*2,sk=shake*Math.sin(tm*70)*10+ang*Math.sin(tm*40)*1.5;
 X.setTransform(S,0,0,S,CX+sk*S,CY);
 // body
 X.save();X.translate(0,br*.5);E(0,250,190,170,'#141414');X.beginPath();X.moveTo(-70,140);X.quadraticCurveTo(0,330,70,140);X.quadraticCurveTo(0,170,-70,140);X.fillStyle='#f4f4f2';X.fill();E(0,260,80,110,'#f4f4f2');X.restore();
 const hr=ang*Math.sin(tm*3)*.03-happy*.08*Math.sin(tm*4);X.translate(0,br);X.rotate(hr+lookX*.05);
 // ears
 for(const s of[-1,1]){X.save();X.translate(s*105,-95);X.rotate(s*(.15+ang*.9-happy*.1)+s*Math.max(0,Math.sin(tm*.9+s))**20*.25);
  X.beginPath();X.moveTo(-45,30);X.quadraticCurveTo(-10,-60,s*0+5,-95);X.quadraticCurveTo(30,-40,45,30);X.fillStyle='#141414';X.fill();
  X.beginPath();X.moveTo(-25,20);X.quadraticCurveTo(-5,-40,5,-70);X.quadraticCurveTo(20,-30,28,20);X.fillStyle='#8a5a5f';X.fill();X.restore()}
 // head
 E(0,0,170,148,'#141414');E(0,15,150,130,'#1b1b1b');
 // blaze + muzzle
 X.beginPath();X.moveTo(-6,-70);X.quadraticCurveTo(-18,0,-55,55);X.quadraticCurveTo(-75,110,0,128);X.quadraticCurveTo(75,110,55,55);X.quadraticCurveTo(18,0,6,-70);X.fillStyle='#f6f6f4';X.fill();
 E(-34,72,40,32,'#f6f6f4');E(34,72,40,32,'#f6f6f4');
 // eyes
 for(const s of[-1,1]){const ex=s*68,ey=-12;E(ex,ey,34,32,'#0a0a0a');const eg=X.createRadialGradient(ex,ey,4,ex,ey,30);eg.addColorStop(0,'#e6ec8c');eg.addColorStop(1,'#93a24a');E(ex,ey,30,28,eg);
  const pw=(st==='att'?5:9)+ang*-3+(1-ang)*Math.sin(tm*.7)*2;E(ex+lookX*10,ey+lookY*7,Math.max(3,pw),24,'#080808');E(ex-8+lookX*8,ey-10,5,6,'#ffffffcc');
  const lid=Math.max(blink,ang*.45,happy);X.save();X.beginPath();X.ellipse(ex,ey,32,30,0,0,7);X.clip();
  X.fillStyle='#141414';X.beginPath();X.moveTo(ex-40,ey-40);X.lineTo(ex+40,ey-40);X.lineTo(ex+40,ey-30+60*lid+s*ang*-14);X.lineTo(ex-40,ey-30+60*lid-s*ang*-14);X.fill();
  if(happy>.3){X.fillRect(ex-40,ey+2,80,40)}X.restore();
  if(happy>.3){X.strokeStyle='#666';X.lineWidth=4;X.beginPath();X.arc(ex,ey+8,18,Math.PI*1.15,Math.PI*1.85);X.stroke()}}
 // nose
 const nt=st==='att'?Math.sin(twitch)*2:0;X.beginPath();X.moveTo(-15,34+nt*.3);X.quadraticCurveTo(0,28,15,34+nt*.3);X.quadraticCurveTo(4,52,0,54);X.quadraticCurveTo(-4,52,-15,34);X.fillStyle='#c98b8e';X.fill();
 E(-7,46,3.5,2.5,'#6b3c40');E(7,46,3.5,2.5,'#6b3c40');
 // mouth
 X.strokeStyle='#555';X.lineWidth=2.5;X.beginPath();X.moveTo(0,54);X.lineTo(0,66);X.moveTo(-18,72);X.quadraticCurveTo(-8,78,0,66);X.quadraticCurveTo(8,78,18,72);X.stroke();
 if(ang>.3){const o=(ang-.3)*30;E(0,84,10+o*.5,4+o,'#5a1d22');X.fillStyle='#fff';X.beginPath();X.moveTo(-10,82);X.lineTo(-7,82+o*.5);X.lineTo(-4,82);X.moveTo(4,82);X.lineTo(7,82+o*.5);X.lineTo(10,82);X.fill()}
 else E(1,82,5,4,'#d98a96');
 // whiskers
 X.strokeStyle='#ffffffcc';X.lineWidth=1.6;for(const s of[-1,1])for(let i=0;i<3;i++){const w=Math.sin(tm*2+i)*3+ang*-15*s;X.beginPath();X.moveTo(s*55,68+i*8);X.quadraticCurveTo(s*120,58+i*10+w,s*175,55+i*16+w);X.stroke()}
 // snot
 X.setTransform(1,0,0,1,0,0);const nw={x:CX+sk*S+(NOS.x)*S,y:CY+(NOS.y+br)*S};
 if(st==='ready'||(st==='lose'&&prog<.01)){const b=1+Math.sin(tm*3)*.15+(1-prog)*.3;X.fillStyle='#c9e07acc';X.beginPath();X.ellipse(nw.x-2*S,nw.y+7*S*b,5*S,9*S*b,.15,0,7);X.fill();E2(nw.x-4*S,nw.y+4*S,1.5*S)}
 if(hint>0){X.strokeStyle=`rgba(255,80,80,${hint})`;X.lineWidth=3;X.beginPath();X.arc(nw.x,nw.y,(26+(1-hint)*20)*S,0,7);X.stroke()}
 const tip={x:mx,y:my};
 if(st==='att'||st==='win'||(st==='lose'&&prog>.01)){const rem=Math.max(0,1-prog);if(rem>0&&st!=='win'){X.strokeStyle='#bcd96acc';X.lineCap='round';X.lineWidth=(2+rem*6)*S;X.beginPath();X.moveTo(nw.x,nw.y+3*S);
   const mxp=(nw.x+tip.x)/2,myp=Math.max(nw.y,tip.y)+(20+rem*40)*S;X.quadraticCurveTo(mxp,myp,tip.x,tip.y);X.stroke();E2(nw.x-2*S,nw.y+6*S,(2+rem*4)*S)}}
 // tissue
 X.save();X.translate(mx,my);X.rotate(-.75);const L=170*S;
 const tg=X.createLinearGradient(0,0,L,0);tg.addColorStop(0,'#fff');tg.addColorStop(1,'#e2e2e2');X.fillStyle=tg;X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(L*.4,-14*S,L,-38*S);X.lineTo(L+10*S,0);X.lineTo(L,38*S);X.quadraticCurveTo(L*.4,14*S,0,0);X.fill();
 X.strokeStyle='#0002';X.lineWidth=1.5*S;for(let i=0;i<7;i++){const u=((i/7+rot*.05)%1);X.beginPath();X.moveTo(u*L,-u*30*S);X.lineTo(Math.min(L,u*L+22*S),u*30*S);X.stroke()}
 if(prog>0){const r=(3+Math.min(1,prog)*11)*S;X.save();X.translate(10*S,0);X.rotate(rot);X.strokeStyle='#a9cc55';X.lineWidth=3*S;X.beginPath();for(let a=0;a<Math.min(1,prog)*28;a+=.3){const rr=r*a/(Math.min(1,prog)*28);X.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}X.stroke();X.restore()}
 X.restore();
 // meters
 if(st==='att'){const bw=220*devicePixelRatio,bx=W/2-bw/2,by=H-50*devicePixelRatio,bh=12*devicePixelRatio;X.fillStyle='#0003';X.fillRect(bx,by,bw,bh);X.fillRect(bx,by+22*devicePixelRatio,bw,bh);
  X.fillStyle='#8fc23f';X.fillRect(bx,by,bw*Math.min(1,prog),bh);X.fillStyle=`hsl(${40-irr*40},90%,50%)`;X.fillRect(bx,by+22*devicePixelRatio,bw*Math.min(1,irr),bh);
  X.fillStyle='#333';X.font=`${12*devicePixelRatio}px sans-serif`;X.fillText('콧물',bx-40*devicePixelRatio,by+bh);X.fillText('짜증',bx-40*devicePixelRatio,by+22*devicePixelRatio+bh)}}
function E2(x,y,r){X.fillStyle='#ffffff99';X.beginPath();X.arc(x,y,r,0,7);X.fill()}
requestAnimationFrame(loop);
</script></body></html>
